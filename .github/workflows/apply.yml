name: Apply patch and build
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          P=$(ls fast-mode.patch* 2>/dev/null | head -1)
          if [ -n "$P" ]; then
            git apply --exclude='.github/workflows/build-apk.yml' "$P"
            git rm -q "$P"
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git add -A
            git commit -m "Add Fast Mode (Wi-Fi Direct)"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fast-mode-apk
          path: app/build/outputs/apk/debug/app-debug.apk
